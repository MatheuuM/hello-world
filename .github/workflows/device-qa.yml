name: MOVVA Device Stage 2
on:
  push:
    branches: [studio-device-v2]
permissions:
  contents: read
jobs:
  device-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot exact website source
        run: git archive --format=zip HEAD -o /tmp/movva-device-source.zip
      - name: Run focused device checks when present
        run: |
          if [ -f qa/device-check.cjs ]; then
            npm install --no-save --package-lock=false playwright@1.56.1
            npx playwright install --with-deps chromium
            python3 -m http.server 8077 > /tmp/movva-device-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            timeout 240s node qa/device-check.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movva-device-stage2
          path: |
            /tmp/movva-device-source.zip
            qa-device-output/
          retention-days: 5
