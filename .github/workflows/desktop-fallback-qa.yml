name: MOVVA Desktop 3D Reliability
on:
  push:
    branches: [fix/desktop-3d-runtime-fallback]
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          node --check experience.js
          node --check motion-studio.js
          node --check qa/desktop-fallback-qa.cjs
          timeout 90s npm install --no-save --package-lock=false playwright@1.56.1
          timeout 180s npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run desktop renderer reliability
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8077 >/tmp/movva-server.log 2>&1 &
          timeout 230s node qa/desktop-fallback-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-fallback-${{ matrix.engine }}
          path: qa-desktop-fallback/${{ matrix.engine }}/
          retention-days: 4
  approval:
    needs: browsers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-fallback-*
          path: evidence
      - name: Require both browsers
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          checks=0
          for name in ('chromium','webkit'):
            f=pathlib.Path('evidence')/('desktop-fallback-'+name)/'report.json'
            r=json.loads(f.read_text())
            assert r['status']=='PASS' and r['commit']==os.environ['GITHUB_SHA'],(name,r.get('failure'))
            assert len(r['checks'])>=8 and len(r['screenshots'])>=3
            checks+=len(r['checks'])
          print('PASS',checks,'desktop recovery checks')
          PY
