name: MOVVA Intro Stage 4
on:
  push:
    branches: [studio-intro-v4]
permissions:
  contents: read
jobs:
  intro-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed runtime and prepare baseline
        run: |
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const manifest=JSON.parse(fs.readFileSync('qa/stage4-runtime-manifest.json','utf8'));
          for(const [file,expected] of Object.entries(manifest.runtime)){
            const bytes=fs.readFileSync(file);
            const actual=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
            assert.equal(actual,expected,file+' differs from the reviewed runtime');
          }
          console.log('Reviewed runtime hashes match.');
          JS
          node qa/prepare-intro.cjs
          node --check experience.js
          node --check intro-scroll.js
          timeout 90s npm install --no-save --package-lock=false playwright@1.56.1
          timeout 90s npx playwright install chromium
      - name: Browser review and baseline regression
        run: |
          python3 -m http.server 8077 > /tmp/movva-intro.log 2>&1 &
          python3 -m http.server 8078 --directory /tmp/movva-intro-baseline > /tmp/movva-baseline.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          timeout 360s node qa/intro-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movva-intro-stage4
          path: |
            qa-intro-output/
            qa/stage4-runtime-manifest.json
          retention-days: 5
