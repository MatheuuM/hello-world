name: MOVVA Stage 1A Safari Renderer Investigation
on:
  push:
    branches: [prototype/3d-unibody-stage1a]
permissions:
  contents: read
jobs:
  compare:
    name: Compositor / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser install
        run: |
          node --check qa/stage1a-webkit-debug.cjs
          timeout 90s npm install --no-save --package-lock=false playwright@1.56.1
          timeout 180s npx playwright install --with-deps ${{ matrix.engine }}
      - name: Compare CSS 3D compositor variants
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8077 >/tmp/movva.log 2>&1 &
          timeout 160s node qa/stage1a-webkit-debug.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-compositor-${{ matrix.engine }}
          path: qa-stage1a-debug/${{ matrix.engine }}/
          retention-days: 3
