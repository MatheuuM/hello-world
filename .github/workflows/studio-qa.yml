name: MOVVA Studio QA
on:
  push:
    branches: [studio-3d]
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser validation when test suite is present
        run: |
          if [ -f qa/browser-check.cjs ]; then
            npm install --no-save --package-lock=false playwright@1.56.1
            npx playwright install --with-deps chromium
            python3 -m http.server 8077 > /tmp/movva-server.log 2>&1 &
            node qa/browser-check.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movva-studio-qa
          path: |
            qa-output/
            assets/*.webp
          retention-days: 5
