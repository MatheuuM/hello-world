name: MOVVA Hero Stage 3
on:
  push:
    branches: [studio-hero-v3]
permissions:
  contents: read
jobs:
  hero-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and install browser
        run: |
          node --check experience.js
          node --check hero-layout.js
          timeout 90s npm install --no-save --package-lock=false playwright@1.56.1
          timeout 90s npx playwright install chromium
      - name: Validate opening only and regression boundaries
        run: |
          python3 -m http.server 8077 > /tmp/movva-hero-server.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          timeout 180s node qa/hero-check.cjs
          timeout 60s node qa/hero-fallback-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movva-hero-stage3
          path: |
            qa-hero-output/
            hero.css
            hero-layout.js
            experience.js
            index.html
            qa/hero-check.cjs
            qa/hero-fallback-check.cjs
            .github/workflows/hero-qa.yml
          retention-days: 5
