name: MOVVA Always-on 3D Browser QA
on:
  push:
    branches: [fix/movva-always-on-3d]
permissions:
  contents: read
jobs:
  browser:
    name: Always-on / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and install browsers
        run: |
          node --check experience.js
          node --check mobile-phone.js
          node --check qa/always-on-browser.cjs
          timeout 100s npm install --no-save --package-lock=false playwright@1.56.1
          timeout 200s npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify automatic 3D on all supported settings
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8077 > /tmp/movva-server.log 2>&1 &
          timeout 245s node qa/always-on-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: always-on-${{ matrix.engine }}
          path: qa-always-on/${{ matrix.engine }}/
          retention-days: 5
  gate:
    name: Full automatic 3D acceptance
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: always-on-*
          path: evidence
      - name: Approve only the same tested commit on both browsers
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          checks=0
          for engine in ['chromium','webkit']:
            p=pathlib.Path('evidence')/f'always-on-{engine}'/'report.json'
            r=json.loads(p.read_text())
            assert r['status']=='PASS' and r['sha']==os.environ['GITHUB_SHA'],(engine,r.get('failure'))
            assert len(r['checks'])>=9 and len(r['images'])>=5
            checks+=len(r['checks'])
          print('PASS:',checks,'checks, both browsers, one commit')
          PY
