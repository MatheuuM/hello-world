name: MOVVA Mobile Ultra-Light 3D QA
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_legacy_benchmark:
        description: Compare the two archived mobile CSS 3D releases
        type: boolean
        default: false
concurrency:
  group: movva-ultralight-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  comparison:
    name: Archived benchmark ${{ matrix.engine }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out both benchmark releases
        run: |
          git worktree add --detach /tmp/movva-baseline 309278fbcf1939ea2363c636a712fd51dd608513
          git worktree add --detach /tmp/movva-four-planes 68e4cab6f216b9ddd1908677ac6b4bc29b1bd6ec
          node --check experience.js
          node --check phone-shell.js
          node --check mobile-phone.js
          node --check motion-studio.js
          node --check qa/mobile-ultralight-performance.cjs
          npm install --no-save --package-lock=false playwright@1.64.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run identical native-scroll profile in both versions
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8078 -d /tmp/movva-baseline >/tmp/movva-baseline.log 2>&1 &
          python3 -m http.server 8077 -d /tmp/movva-four-planes >/tmp/movva-candidate.log 2>&1 &
          timeout 460s node qa/mobile-ultralight-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultralight-perf-${{ matrix.engine }}
          path: qa-ultralight/${{ matrix.engine }}/
          retention-days: 7
  regression:
    name: Browser regression ${{ matrix.engine }}
    if: github.event_name != 'workflow_dispatch' || !inputs.run_legacy_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build site and install browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.64.0
          npm run build
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Validate mobile scroll, screen textures and renderer fallback
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_VIEWPORT: touch
        run: |
          node qa/serve-static.cjs dist 8077 >/tmp/movva-qa.log 2>&1 &
          timeout 270s node qa/phone-story.cjs
