name: MOVVA Immersive Source Bundle
on:
  push:
    branches: [feature/immersive-3d-cards]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive checked-out source
        run: tar czf /tmp/movva-feature-source.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
      - uses: actions/upload-artifact@v4
        with:
          name: movva-feature-source
          path: /tmp/movva-feature-source.tar.gz
          retention-days: 3
